<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Slide Show</title>
    <link rel="stylesheet" href="css/main.css" />
  </head>
  <body>
    <div id="my-slideshow">
      <div class="track">
        <!-- Slide 1 -->
        <div class="slide active">
          <img src="./images/1.jpg" alt="slide-image" />
        </div>
        <!-- Slide 2 -->
        <div class="slide">
          <img src="./images/2.jpg" alt="slide-image" />
        </div>
        <!-- Slide 3 -->
        <div class="slide">
          <img src="./images/3.jpg" alt="slide-image" />
        </div>
        <div class="slide">
          <img src="./images/4.jpg" alt="slide-image" />
        </div>
        <div class="slide">
          <img src="./images/5.jpg" alt="slide-image" />
        </div>
      </div>
      <div class="btn-icon">
        <span class="btn-prev btn">&lt;</span>
        <span class="btn-next btn">&gt;</span>
      </div>
      <div class="navigation">
        <div class="circle-item active"></div>
        <div class="circle-item"></div>
        <div class="circle-item"></div>
        <div class="circle-item"></div>
        <div class="circle-item"></div>
      </div>
    </div>

    <script src="js/main.js"></script>
  </body>
</html>
